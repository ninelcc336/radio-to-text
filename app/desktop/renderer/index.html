<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旧版渲染层已迁移</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1e8;
        --panel: rgba(255, 253, 248, 0.94);
        --ink: #1f1e1a;
        --muted: #6a6458;
        --line: #d9cfbb;
        --accent: #a3462f;
        --accent-soft: rgba(163, 70, 47, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #fff7d6 0, transparent 28%),
          radial-gradient(circle at bottom right, #f2d2bf 0, transparent 24%),
          var(--bg);
      }

      main {
        width: min(720px, 100%);
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 56px rgba(69, 47, 20, 0.1);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.8;
      }

      .stack {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }

      .card {
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fffaf2;
      }

      .card strong {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
      }

      code {
        padding: 2px 6px;
        border-radius: 8px;
        background: rgba(31, 30, 26, 0.06);
        font-family: Consolas, "Courier New", monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Legacy Renderer</div>
      <h1>桌面前端已迁移到 Next.js</h1>
      <p>
        当前页面只保留为迁移说明和回退提示，不再承载任务列表、详情、播放器或审校逻辑。
        正式桌面界面现在由 Electron 主进程加载 <code>app/desktop/web</code> 下的 Next.js 前端。
      </p>
      <div class="stack">
        <section class="card">
          <strong>正常入口</strong>
          <p>开发模式请使用 <code>npm run dev</code>，生产模式请使用 <code>npm start</code> 或打包产物启动。</p>
        </section>
        <section class="card">
          <strong>出现这个页面通常意味着</strong>
          <p>Next 渲染层未成功启动，Electron 回退到了旧入口。优先检查 <code>npm run build:web</code>、桌面启动日志和打包资源是否完整。</p>
        </section>
      </div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
