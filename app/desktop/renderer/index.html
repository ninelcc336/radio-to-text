<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音频转文本</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1e8;
        --panel: #fffdf8;
        --ink: #1f1e1a;
        --muted: #6a6458;
        --line: #d9cfbb;
        --accent: #a3462f;
        --accent-strong: #7d2f1d;
        --export-bg: #efe4d2;
        --export-hover: #e4d4bb;
        --export-active: #9f5f2e;
        --view-bg: #dfe7ea;
        --view-hover: #d2dde2;
        --view-active: #476779;
        --success-bg: #dfeede;
        --success-hover: #d0e3cf;
        --success-ink: #2f6541;
        --edit-bg: #f0e3cd;
        --edit-hover: #e7d6ba;
        --edit-ink: #835029;
        --shadow: rgba(69, 47, 20, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #fff7d6 0, transparent 32%),
          radial-gradient(circle at bottom right, #f2d2bf 0, transparent 28%),
          var(--bg);
      }

      .shell {
        display: grid;
        grid-template-columns: 380px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        padding: 28px;
        border-right: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.76);
        backdrop-filter: blur(12px);
      }

      .content {
        padding: 28px;
      }

      .detail-shell {
        position: relative;
      }

      .detail-shell.is-busy .grid {
        pointer-events: none;
        user-select: none;
      }

      .detail-busy-overlay {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(244, 241, 232, 0.74);
        backdrop-filter: blur(2px);
      }

      .detail-busy-overlay.is-hidden {
        display: none;
      }

      .detail-busy-card {
        display: grid;
        gap: 10px;
        min-width: 220px;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 253, 248, 0.96);
        box-shadow: 0 18px 40px var(--shadow);
        text-align: center;
      }

      .detail-busy-spinner {
        width: 24px;
        height: 24px;
        margin: 0 auto;
        border-radius: 999px;
        border: 3px solid rgba(163, 70, 47, 0.18);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }

      .detail-busy-message {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.5;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 32px;
        line-height: 1.1;
        margin-bottom: 14px;
      }

      .lede {
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 40px var(--shadow);
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .task-row {
        position: relative;
      }

      .actions {
        padding: 18px;
      }

      button {
        width: 100%;
        padding: 14px 16px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }

      button:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      .secondary {
        background: #ebe2d0;
        color: var(--ink);
      }

      .secondary:hover {
        background: #dfd2bb;
      }

      .danger {
        background: #c95d3a;
        color: white;
      }

      .danger:hover {
        background: #a74628;
      }

      .meta {
        padding: 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .panel {
        padding: 22px;
      }

      .panel h2 {
        font-size: 18px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .summary {
        display: grid;
        gap: 14px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .status {
        display: none;
        margin-bottom: 14px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #efb1b1;
        background: #fdecec;
        color: #982d2d;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.5;
      }

      .status.is-visible {
        display: block;
      }

      .status.is-hidden {
        display: none;
      }

      .task-status-banner {
        display: grid;
        gap: 6px;
        padding: 15px 16px;
        border-radius: 16px;
        border: 1px solid transparent;
      }

      .task-status-banner.is-created,
      .task-status-banner.is-ready,
      .task-status-banner.is-unknown {
        background: linear-gradient(135deg, #fbf4df, #f4e7c8);
        border-color: #e8d2a3;
        color: #7d5a17;
      }

      .task-status-banner.is-processing {
        background: linear-gradient(135deg, #fff1db, #ffd7ad);
        border-color: #efb777;
        color: #9b4c00;
        box-shadow: 0 10px 22px rgba(198, 119, 28, 0.14);
      }

      .task-status-banner.is-completed {
        background: linear-gradient(135deg, #ecf9ee, #d7efd9);
        border-color: #a2d2aa;
        color: #1f6b35;
      }

      .task-status-banner.is-failed {
        background: linear-gradient(135deg, #ffeded, #f8d4d4);
        border-color: #e8abab;
        color: #a02e2e;
      }

      .task-status-eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.78;
      }

      .task-status-value {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--ink);
      }

      .task-status-banner.is-created .task-status-value,
      .task-status-banner.is-ready .task-status-value,
      .task-status-banner.is-unknown .task-status-value,
      .task-status-banner.is-processing .task-status-value,
      .task-status-banner.is-completed .task-status-value,
      .task-status-banner.is-failed .task-status-value {
        color: inherit;
      }

      .task-status-stage {
        font-size: 13px;
        font-weight: 600;
        opacity: 0.9;
      }

      .task-detail-grid {
        display: grid;
        gap: 10px;
      }

      .task-detail-row {
        display: grid;
        gap: 2px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #fcf8f0;
        border: 1px solid rgba(217, 207, 187, 0.68);
      }

      .task-detail-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #8b816f;
      }

      .task-detail-value {
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        word-break: break-word;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .grid {
        display: grid;
        gap: 20px;
      }

      .task-item-button {
        margin: 0;
        text-align: left;
        padding-right: 52px;
      }

      .task-item-button.is-active {
        background: linear-gradient(135deg, #d3724f, #b74e2f);
        color: white;
        box-shadow: 0 12px 26px rgba(163, 70, 47, 0.22);
      }

      .task-item-button.is-active:hover {
        background: linear-gradient(135deg, #c96545, #a74428);
      }

      .task-item-button.is-active .task-subtitle {
        color: rgba(255, 255, 255, 0.82);
      }

      .task-name {
        display: block;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
      }

      .task-name-edit {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fffaf1;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        outline: none;
      }

      .task-name-edit:focus {
        border-color: #c78a6c;
        box-shadow: 0 0 0 3px rgba(199, 138, 108, 0.14);
      }

      .task-subtitle {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }

      .task-delete-button {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 28px;
        min-width: 28px;
        height: 28px;
        padding: 0;
        margin: 0;
        border-radius: 999px;
        font-size: 13px;
        line-height: 28px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease, background 140ms ease;
        transform: scale(0.92);
      }

      .task-rename-button {
        position: absolute;
        top: 10px;
        right: 44px;
        width: 28px;
        min-width: 28px;
        height: 28px;
        padding: 0;
        margin: 0;
        border-radius: 999px;
        font-size: 13px;
        line-height: 28px;
        background: #e7d9c3;
        color: var(--ink);
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease, background 140ms ease;
        transform: scale(0.92);
      }

      .task-rename-button:hover {
        background: #dccab0;
      }

      .task-row:hover .task-delete-button,
      .task-row:hover .task-rename-button {
        opacity: 1;
        pointer-events: auto;
        transform: scale(1);
      }

      .output-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .output-toolbar.is-hidden {
        display: none;
      }

      .toolbar-main {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .toolbar-main.is-hidden {
        display: none;
      }

      .toolbar-cluster {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .toolbar-divider {
        width: 1px;
        align-self: stretch;
        background: rgba(106, 100, 88, 0.16);
      }

      .toolbar-actions {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .output-toolbar button {
        width: auto;
        min-height: 34px;
        padding: 7px 11px;
        border-radius: 999px;
        font-size: 12px;
        line-height: 1;
      }

      .toolbar-export-trigger {
        background: var(--export-bg);
        color: var(--ink);
      }

      .toolbar-export-trigger:hover {
        background: var(--export-hover);
      }

      .toolbar-export-trigger.is-open {
        background: var(--export-active);
        color: white;
      }

      .toolbar-export-trigger.is-open:hover {
        background: #864b1f;
      }

      .toolbar-view {
        background: var(--view-bg);
        color: #29404b;
      }

      .toolbar-view:hover {
        background: var(--view-hover);
      }

      .toolbar-toggle.toolbar-view.is-active {
        background: var(--view-active);
        color: white;
      }

      .toolbar-toggle.toolbar-view.is-active:hover {
        background: #3e5c6d;
      }

      .toolbar-count {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 7px 11px;
        border-radius: 999px;
        /* background: rgba(71, 103, 121, 0.14); */
        color: #476779;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .toolbar-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 10;
        display: grid;
        gap: 6px;
        min-width: 154px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 253, 248, 0.98);
        box-shadow: 0 16px 34px rgba(69, 47, 20, 0.12);
        backdrop-filter: blur(10px);
      }

      .toolbar-dropdown.is-hidden {
        display: none;
      }

      .toolbar-dropdown button {
        justify-content: flex-start;
        min-width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        background: #f2e8d8;
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
      }

      .toolbar-dropdown button:hover {
        background: #e7d9c2;
      }

      .output-frame {
        max-height: min(58vh, 720px);
        overflow-y: auto;
        padding-right: 4px;
      }

      .output-frame::-webkit-scrollbar {
        width: 10px;
      }

      .output-frame::-webkit-scrollbar-thumb {
        background: rgba(106, 100, 88, 0.28);
        border-radius: 999px;
      }

      .output-frame::-webkit-scrollbar-track {
        background: transparent;
      }

      .player-shell {
        display: grid;
        gap: 16px;
      }

      .player-status {
        padding: 12px 14px;
        border-radius: 12px;
        background: #f7f1e5;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .player-controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .player-controls button {
        padding: 12px 14px;
      }

      .player-timeline {
        display: grid;
        gap: 8px;
      }

      .player-timebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .player-range {
        width: 100%;
        margin: 0;
        accent-color: var(--accent);
      }

      .player-range:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .player-hint {
        color: var(--muted);
        font-size: 12px;
      }

      .transcript-list {
        display: grid;
        gap: 10px;
      }

      .transcript-plain {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.7;
        font-family: Consolas, "Courier New", monospace;
        color: var(--ink);
      }

      .segment-button {
        display: grid;
        grid-template-columns: 92px 1fr;
        align-items: start;
        gap: 14px;
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #e6dbc9;
        border-radius: 14px;
        background: #fffaf2;
        color: var(--ink);
        text-align: left;
        box-shadow: none;
      }

      .segment-button:hover {
        background: #f6ebd8;
      }

      .segment-card.is-active .segment-button {
        border-color: rgba(163, 70, 47, 0.42);
        background: linear-gradient(135deg, rgba(163, 70, 47, 0.16), rgba(163, 70, 47, 0.04));
        box-shadow: inset 0 0 0 1px rgba(163, 70, 47, 0.08);
      }

      .segment-card.needs-review .segment-button {
        border-color: rgba(171, 104, 23, 0.4);
        background: #fffaf2;
        box-shadow: inset 0 0 0 1px rgba(171, 104, 23, 0.08);
      }

      .segment-card {
        display: grid;
        gap: 10px;
      }

      .segment-time {
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }

      .segment-copy {
        display: grid;
        gap: 8px;
      }

      .segment-text {
        display: block;
        font-size: 14px;
        line-height: 1.65;
      }

      .segment-review {
        display: grid;
        gap: 4px;
      }

      .segment-review-badge {
        display: inline-flex;
        width: fit-content;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(171, 104, 23, 0.14);
        color: #8a4d08;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .segment-review-reasons {
        color: #8a5d2e;
        font-size: 12px;
        line-height: 1.5;
      }

      .segment-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
        padding: 0 6px 0 106px;
        opacity: 0;
        transform: translateY(4px);
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .segment-card:hover .segment-actions,
      .segment-card:focus-within .segment-actions {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .segment-actions button,
      .segment-editor-actions button {
        width: auto;
        min-height: 32px;
        padding: 7px 11px;
        border-radius: 999px;
        font-size: 12px;
        line-height: 1;
      }

      .segment-action-confirm {
        background: var(--success-bg);
        color: var(--success-ink);
      }

      .segment-action-confirm:hover {
        background: var(--success-hover);
      }

      .segment-action-edit {
        background: var(--edit-bg);
        color: var(--edit-ink);
      }

      .segment-action-edit:hover {
        background: var(--edit-hover);
      }

      .segment-action-save {
        background: var(--success-ink);
        color: white;
      }

      .segment-action-save:hover {
        background: #265339;
      }

      .segment-action-delete {
        background: #f8dddd;
        color: #972f2f;
      }

      .segment-action-delete:hover {
        background: #f2caca;
      }

      .segment-status-chip {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(106, 100, 88, 0.12);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .segment-status-chip.is-corrected {
        background: rgba(52, 124, 80, 0.12);
        color: #2e6b46;
      }

      .segment-status-chip.is-confirmed {
        background: rgba(53, 99, 171, 0.12);
        color: #355aa0;
      }

      .segment-editor {
        display: grid;
        gap: 10px;
        padding: 0 6px 0 106px;
      }

      .segment-editor textarea {
        width: 100%;
        min-height: 104px;
        resize: vertical;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffdf8;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.6;
        font-family: inherit;
        outline: none;
      }

      .segment-editor textarea:focus {
        border-color: #c78a6c;
        box-shadow: 0 0 0 3px rgba(199, 138, 108, 0.14);
      }

      .segment-editor-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .empty-state {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .output-toolbar {
          align-items: stretch;
        }

        .toolbar-main {
          width: 100%;
        }

        .segment-actions,
        .segment-editor {
          padding-left: 0;
        }

        .segment-button {
          grid-template-columns: 1fr;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <h1>音频转文本</h1>
        <p class="lede">
          本地优先：导入录音、发起处理、查看结果，并导出本地纪要。
        </p>
        <div class="card stack actions">
          <button id="select-button">选择音频并创建任务</button>
          <button id="process-button" class="secondary">处理当前任务</button>
          <button id="refresh-button" class="secondary">刷新任务列表</button>
        </div>
        <div class="card panel" style="margin-top: 12px;">
          <div class="panel-header">
            <h2>任务列表</h2>
          </div>
          <div id="task-list" class="stack"></div>
        </div>
      </aside>
      <main class="content">
        <div id="status" class="status is-hidden" role="alert" aria-live="assertive"></div>
        <div id="detail-shell" class="detail-shell">
          <div
            id="detail-busy-overlay"
            class="detail-busy-overlay is-hidden"
            aria-hidden="true"
          >
            <div class="detail-busy-card" role="status" aria-live="polite">
              <div class="detail-busy-spinner" aria-hidden="true"></div>
              <div id="detail-busy-message" class="detail-busy-message">正在确认片段...</div>
            </div>
          </div>
          <div class="grid">
          <section class="card panel">
            <div class="panel-header">
              <h2>任务信息</h2>
            </div>
            <div id="task-detail" class="summary">尚未选择任务。</div>
          </section>
          <section class="card panel">
            <div class="panel-header">
              <h2>音频播放器</h2>
            </div>
            <div class="player-shell">
              <div id="audio-status" class="player-status">尚未选择任务。</div>
              <div class="player-controls">
                <button id="seek-backward-button" class="secondary" type="button">-10s</button>
                <button id="play-toggle-button" type="button">播放</button>
                <button id="seek-forward-button" class="secondary" type="button">+10s</button>
              </div>
              <div class="player-timeline">
                <div class="player-timebar">
                  <span id="audio-current-time">00:00:00</span>
                  <span id="audio-duration">00:00:00</span>
                </div>
                <input
                  id="audio-progress"
                  class="player-range"
                  type="range"
                  min="0"
                  max="0"
                  step="0.1"
                  value="0"
                  disabled
                />
                <div class="player-hint">支持拖动与点击进度条，适合边听边核对句子。</div>
              </div>
              <audio id="task-audio" preload="metadata"></audio>
            </div>
          </section>
          <section class="card panel">
            <div class="panel-header">
              <h2>文本产物</h2>
            </div>
            <div id="output-toolbar" class="output-toolbar is-hidden">
              <div id="review-toolbar" class="toolbar-main is-hidden">
                <div class="toolbar-cluster">
                  <button
                    id="view-clean-button"
                    class="toolbar-view toolbar-toggle"
                    type="button"
                    title="查看清洗后的最终文本"
                  >
                    清洗
                  </button>
                  <button
                    id="view-raw-button"
                    class="toolbar-view toolbar-toggle"
                    type="button"
                    title="查看原始识别文本"
                  >
                    原始
                  </button>
                </div>
                <div class="toolbar-divider" aria-hidden="true"></div>
                <div class="toolbar-cluster">
                  <button
                    id="filter-all-button"
                    class="toolbar-view toolbar-toggle"
                    type="button"
                    title="显示全部片段"
                  >
                    全部
                  </button>
                  <button
                    id="filter-review-button"
                    class="toolbar-view toolbar-toggle"
                    type="button"
                    title="仅显示需要重点核对的片段"
                  >
                    重点
                  </button>
                  <button
                    id="filter-unprocessed-button"
                    class="toolbar-view toolbar-toggle"
                    type="button"
                    title="仅显示尚未处理的片段"
                  >
                    未处理
                  </button>
                  <span id="review-count" class="toolbar-count">未处理 0</span>
                </div>
              </div>
              <div class="toolbar-actions">
                <button
                  id="export-menu-button"
                  class="toolbar-export-trigger"
                  type="button"
                  title="展开导出选项"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  导出
                </button>
                <div id="export-dropdown" class="toolbar-dropdown is-hidden">
                  <button
                    id="copy-output-button"
                    type="button"
                    title="复制当前文本"
                  >
                    复制文本
                  </button>
                  <button
                    id="save-output-button"
                    type="button"
                    title="导出 TXT"
                  >
                    导出 TXT
                  </button>
                  <button
                    id="save-md-button"
                    type="button"
                    title="导出 Markdown"
                  >
                    导出 Markdown
                  </button>
                </div>
              </div>
            </div>
            <div class="output-frame">
              <div id="task-output" class="empty-state">尚无转写结果。</div>
            </div>
          </section>
        </div>
        </div>
      </main>
    </div>
    <script src="./review-logic.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
