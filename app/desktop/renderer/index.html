<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会议录音转文字</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1e8;
        --panel: #fffdf8;
        --ink: #1f1e1a;
        --muted: #6a6458;
        --line: #d9cfbb;
        --accent: #a3462f;
        --accent-strong: #7d2f1d;
        --shadow: rgba(69, 47, 20, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #fff7d6 0, transparent 32%),
          radial-gradient(circle at bottom right, #f2d2bf 0, transparent 28%),
          var(--bg);
      }

      .shell {
        display: grid;
        grid-template-columns: 380px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        padding: 28px;
        border-right: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.76);
        backdrop-filter: blur(12px);
      }

      .content {
        padding: 28px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 32px;
        line-height: 1.1;
        margin-bottom: 14px;
      }

      .lede {
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 40px var(--shadow);
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .task-row {
        position: relative;
      }

      .actions {
        padding: 18px;
      }

      button {
        width: 100%;
        padding: 14px 16px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }

      button:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      .secondary {
        background: #ebe2d0;
        color: var(--ink);
      }

      .secondary:hover {
        background: #dfd2bb;
      }

      .danger {
        background: #c95d3a;
        color: white;
      }

      .danger:hover {
        background: #a74628;
      }

      .meta {
        padding: 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .panel {
        padding: 22px;
      }

      .panel h2 {
        font-size: 18px;
      }

      .status-panel h2 {
        margin-bottom: 22px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .summary {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.6;
        font-family: Consolas, "Courier New", monospace;
      }

      .status {
        padding: 12px 14px;
        border-radius: 12px;
        background: #f7f1e5;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
      }

      .status::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 2px solid rgba(163, 70, 47, 0.18);
        border-top-color: var(--accent);
        opacity: 0;
        transform: scale(0.9);
      }

      .status.is-loading::before {
        opacity: 1;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .grid {
        display: grid;
        gap: 20px;
      }

      .task-item-button {
        margin: 0;
        text-align: left;
        padding-right: 52px;
      }

      .task-item-button.is-active {
        background: linear-gradient(135deg, #d3724f, #b74e2f);
        color: white;
        box-shadow: 0 12px 26px rgba(163, 70, 47, 0.22);
      }

      .task-item-button.is-active:hover {
        background: linear-gradient(135deg, #c96545, #a74428);
      }

      .task-item-button.is-active .task-subtitle {
        color: rgba(255, 255, 255, 0.82);
      }

      .task-name {
        display: block;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
      }

      .task-name-edit {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fffaf1;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        outline: none;
      }

      .task-name-edit:focus {
        border-color: #c78a6c;
        box-shadow: 0 0 0 3px rgba(199, 138, 108, 0.14);
      }

      .task-subtitle {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }

      .task-delete-button {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 28px;
        min-width: 28px;
        height: 28px;
        padding: 0;
        margin: 0;
        border-radius: 999px;
        font-size: 13px;
        line-height: 28px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease, background 140ms ease;
        transform: scale(0.92);
      }

      .task-rename-button {
        position: absolute;
        top: 10px;
        right: 44px;
        width: 28px;
        min-width: 28px;
        height: 28px;
        padding: 0;
        margin: 0;
        border-radius: 999px;
        font-size: 13px;
        line-height: 28px;
        background: #e7d9c3;
        color: var(--ink);
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease, transform 140ms ease, background 140ms ease;
        transform: scale(0.92);
      }

      .task-rename-button:hover {
        background: #dccab0;
      }

      .task-row:hover .task-delete-button,
      .task-row:hover .task-rename-button {
        opacity: 1;
        pointer-events: auto;
        transform: scale(1);
      }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .toolbar.is-hidden {
        display: none;
      }

      .toolbar button {
        width: auto;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <h1>会议录音转文字</h1>
        <p class="lede">
          本地优先桌面原型：导入录音、发起处理、按匿名说话人查看结果，并导出本地纪要。
        </p>
        <div class="card stack actions">
          <button id="select-button">选择音频并创建任务</button>
          <button id="process-button" class="secondary">处理当前任务</button>
          <button id="refresh-button" class="secondary">刷新任务列表</button>
        </div>
        <div class="card meta">
          <div>默认处理：本地预处理 + 本地转写 + 本地分人</div>
          <div>当前版本：阶段 1-5 连续开发中</div>
          <div>摘要与云端增强：暂未启用</div>
        </div>
        <div class="card panel">
          <div class="panel-header">
            <h2>任务列表</h2>
          </div>
          <div id="task-list" class="stack"></div>
        </div>
      </aside>
      <main class="content">
        <div class="grid">
          <section class="card panel status-panel">
            <h2>运行状态</h2>
            <div id="status" class="status">等待操作</div>
          </section>
          <section class="card panel">
            <div class="panel-header">
              <h2>最终产物</h2>
              <div id="output-toolbar" class="toolbar is-hidden">
                <button id="copy-output-button" class="secondary" type="button">复制文本</button>
                <button id="save-output-button" class="secondary" type="button">下载 TXT</button>
                <button id="save-md-button" class="secondary" type="button">下载 Markdown</button>
              </div>
            </div>
            <pre id="task-output">尚无转写结果。</pre>
          </section>
          <section class="card panel">
            <div class="panel-header">
              <h2>任务信息</h2>
            </div>
            <div id="task-detail" class="summary">尚未选择任务。</div>
          </section>
        </div>
      </main>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
