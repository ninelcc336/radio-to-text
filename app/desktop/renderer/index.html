<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会议录音转文字</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1e8;
        --panel: #fffdf8;
        --ink: #1f1e1a;
        --muted: #6a6458;
        --line: #d9cfbb;
        --accent: #a3462f;
        --accent-strong: #7d2f1d;
        --shadow: rgba(69, 47, 20, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #fff7d6 0, transparent 32%),
          radial-gradient(circle at bottom right, #f2d2bf 0, transparent 28%),
          var(--bg);
      }

      .shell {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        padding: 28px;
        border-right: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.76);
        backdrop-filter: blur(12px);
      }

      .content {
        padding: 28px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 32px;
        line-height: 1.1;
        margin-bottom: 14px;
      }

      .lede {
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 40px var(--shadow);
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .actions {
        padding: 18px;
      }

      button {
        width: 100%;
        padding: 14px 16px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }

      button:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      .secondary {
        background: #ebe2d0;
        color: var(--ink);
      }

      .secondary:hover {
        background: #dfd2bb;
      }

      .meta {
        padding: 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .panel {
        padding: 22px;
      }

      .panel h2 {
        margin-bottom: 16px;
        font-size: 18px;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.6;
        font-family: Consolas, "Courier New", monospace;
      }

      .status {
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #f7f1e5;
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 20px;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <h1>会议录音转文字</h1>
        <p class="lede">
          本地优先桌面原型：导入录音、发起处理、按匿名说话人查看结果，并导出本地纪要。
        </p>
        <div class="card stack actions">
          <button id="select-button">选择音频并创建任务</button>
          <button id="process-button" class="secondary">处理当前任务</button>
          <button id="refresh-button" class="secondary">刷新任务列表</button>
        </div>
        <div class="card meta">
          <div>默认处理：本地预处理 + 本地转写 + 本地分人</div>
          <div>当前版本：阶段 1-5 连续开发中</div>
          <div>摘要与云端增强：暂未启用</div>
        </div>
        <div class="card panel">
          <h2>任务列表</h2>
          <div id="task-list" class="stack"></div>
        </div>
      </aside>
      <main class="content">
        <div class="grid">
          <section class="card panel">
            <h2>运行状态</h2>
            <div id="status" class="status">等待操作</div>
            <pre id="output">尚无返回结果。</pre>
          </section>
          <section class="card panel">
            <h2>任务详情</h2>
            <pre id="task-detail">尚未选择任务。</pre>
          </section>
        </div>
      </main>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
